{% extends 'admin/layout.html' %}{% block admin_content %}<div class="page-header"><h2 class="mb-0">Manage Resources</h2><a href="#" class="btn btn-primary disabled"><i class="bi bi-plus-circle-fill"></i> Add Resource (WIP)</a></div><div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Name</th><th>Type</th><th>Location</th><th class="text-end">Actions</th></tr></thead><tbody>{% for resource in resources %}<tr><td>{{ resource.name }}</td><td>{{ resource.resource_type.value }}</td><td>{{ resource.location }}</td><td class="text-end"><a href="#" class="btn btn-sm btn-secondary disabled">Edit</a> <a href="#" class="btn btn-sm btn-danger disabled">Delete</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
